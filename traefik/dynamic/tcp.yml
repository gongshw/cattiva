# TCP routing - passthrough all traffic to xray
# xray handles Reality auth and fallback internally

tcp:
  routers:
    xray:
      rule: "HostSNI(`*`)"
      entryPoints:
        - websecure
      service: xray
      tls:
        passthrough: true

  services:
    xray:
      loadBalancer:
        servers:
          - address: xray:4433
