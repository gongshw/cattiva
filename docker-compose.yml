services:
  config-gen:
    image: python:3-alpine
    container_name: cattiva-config-gen
    volumes:
      - xray-reality-config:/etc/xray-reality
      - xray-vmess-config:/etc/xray-vmess
      - traefik-dynamic:/etc/traefik/dynamic
      - traefik-config:/etc/traefik/static
      - ./xray:/templates/xray:ro
      - ./traefik/dynamic:/templates/traefik/dynamic:ro
      - ./traefik/traefik.yml.template:/templates/traefik/traefik.yml.template:ro
      - ./entrypoint.py:/entrypoint.py:ro
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:?err}
      - ACME_EMAIL=${ACME_EMAIL:?err}
      - VLESS_UUID=${VLESS_UUID:?err}
      - REALITY_PRIVATE_KEY=${REALITY_PRIVATE_KEY:?err}
      - REALITY_SERVER_NAME=${REALITY_SERVER_NAME:-www.apple.com}
      - REALITY_SHORT_ID=${REALITY_SHORT_ID:?err}
      - VMESS_UUID=${VMESS_UUID:?err}
      - VMESS_WS_PATH=${VMESS_WS_PATH:-/proxy/ws}
      - SITE_ALIASES=${SITE_ALIASES:-}
    command: ["python3", "/entrypoint.py"]

  traefik:
    image: traefik:latest
    container_name: traefik
    restart: always
    command:
      - --configFile=/etc/traefik/static/traefik.yml
    ports:
      - ${PORT_HTTP:-80}:80
      - ${PORT_HTTPS:-443}:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-config:/etc/traefik/static:ro
      - traefik-dynamic:/etc/traefik/dynamic
      - ./data/acme:/acme
      - ./data/traefik:/data
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:?err}
    depends_on:
      config-gen:
        condition: service_completed_successfully
    networks:
      - cattiva

  xray-reality:
    image: ghcr.io/xtls/xray-core:latest
    container_name: xray-reality
    restart: always
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - xray-reality-config:/etc/xray:ro
    depends_on:
      config-gen:
        condition: service_completed_successfully
    networks:
      - cattiva

  xray-vmess:
    image: ghcr.io/xtls/xray-core:latest
    container_name: xray-vmess
    restart: always
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - xray-vmess-config:/etc/xray:ro
    depends_on:
      config-gen:
        condition: service_completed_successfully
    networks:
      - cattiva

  static:
    image: nginx:alpine
    container_name: cattiva-static
    restart: always
    volumes:
      - ${WWW_DIR:-./www}:/usr/share/nginx/html:ro
    networks:
      - cattiva

networks:
  cattiva:
    driver: bridge

volumes:
  xray-reality-config:
  xray-vmess-config:
  traefik-dynamic:
  traefik-config:
