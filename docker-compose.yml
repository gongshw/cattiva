services:
  config-gen:
    image: alpine:latest
    container_name: cattiva-config-gen
    volumes:
      - xray-configs:/etc/xray
      - traefik-dynamic:/etc/traefik/dynamic
      - traefik-config:/etc/traefik/static
      - ./xray:/templates/xray:ro
      - ./traefik/dynamic/tcp.yml.template:/templates/traefik/tcp.yml.template:ro
      - ./traefik/traefik.yml.template:/templates/traefik/traefik.yml.template:ro
      - ./entrypoint.sh:/entrypoint.sh:ro
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:?err}
      - ACME_EMAIL=${ACME_EMAIL:?err}
      - VLESS_UUID=${VLESS_UUID:?err}
      - REALITY_PRIVATE_KEY=${REALITY_PRIVATE_KEY:?err}
      - REALITY_DEST=${REALITY_DEST:-www.apple.com:443}
      - REALITY_SERVER_NAMES=${REALITY_SERVER_NAMES:-www.apple.com, www.icloud.com}
      - REALITY_SHORT_ID=${REALITY_SHORT_ID:-6ba85179e30d4fc2}
      - VMESS_UUID=${VMESS_UUID:?err}
      - VMESS_WS_PATH=${VMESS_WS_PATH:-/proxy/ws}
    command: ["sh", "/entrypoint.sh"]

  traefik:
    image: traefik:latest
    container_name: traefik
    restart: always
    command:
      - --configFile=/etc/traefik/static/traefik.yml
    ports:
      - ${PORT_HTTP:-80}:80
      - ${PORT_HTTPS:-443}:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-config:/etc/traefik/static:ro
      - traefik-dynamic:/etc/traefik/dynamic
      - ./data/acme:/acme
      - ./data/traefik:/data
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:?err}
    depends_on:
      config-gen:
        condition: service_completed_successfully
    networks:
      - cattiva

  xray-reality:
    image: ghcr.io/xtls/xray-core:latest
    container_name: xray-reality
    restart: always
    volumes:
      - xray-configs:/etc/xray:ro
    depends_on:
      config-gen:
        condition: service_completed_successfully
    networks:
      - cattiva

  xray-vmess:
    image: ghcr.io/xtls/xray-core:latest
    container_name: xray-vmess
    restart: always
    volumes:
      - xray-configs:/etc/xray:ro
    depends_on:
      config-gen:
        condition: service_completed_successfully
    networks:
      - cattiva

  static:
    image: nginx:alpine
    container_name: cattiva-static
    restart: always
    volumes:
      - ${WWW_DIR:-./www}:/usr/share/nginx/html:ro
    networks:
      - cattiva

networks:
  cattiva:
    driver: bridge

volumes:
  xray-configs:
  traefik-dynamic:
  traefik-config:
