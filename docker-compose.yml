services:
  config-gen:
    image: python:3-alpine
    container_name: cattiva-config-gen
    volumes:
      - xray-reality-config:/etc/xray-reality
      - xray-vmess-config:/etc/xray-vmess
      - traefik-dynamic:/etc/traefik/dynamic
      - traefik-config:/etc/traefik/static
      - hysteria-config:/etc/hysteria
      - ./xray:/templates/xray:ro
      - ./traefik/dynamic:/templates/traefik/dynamic:ro
      - ./traefik/traefik.yml.j2:/templates/traefik/traefik.yml.j2:ro
      - ./hysteria/server.yaml.j2:/templates/hysteria/server.yaml.j2:ro
      - ./entrypoint.py:/entrypoint.py:ro
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:?err}
      - ACME_EMAIL=${ACME_EMAIL:?err}
      - VLESS_UUID=${VLESS_UUID:?err}
      - REALITY_PRIVATE_KEY=${REALITY_PRIVATE_KEY:?err}
      - REALITY_SERVER_NAME=${REALITY_SERVER_NAME:-cloudflare.com}
      - REALITY_SHORT_ID=${REALITY_SHORT_ID:?err}
      - VMESS_UUID=${VMESS_UUID:?err}
      - VMESS_WS_PATH=${VMESS_WS_PATH:-/proxy/ws}
      - SITE_ALIASES=${SITE_ALIASES:-}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:?err}
      - HYSTERIA_PASSWORD=${HYSTERIA_PASSWORD:?err}
      - HYSTERIA_DOMAIN=${HYSTERIA_DOMAIN:-${SITE_DOMAIN}}
      - HYSTERIA_PORT=${HYSTERIA_PORT:-443}
      - HYSTERIA_TLS_MODE=${HYSTERIA_TLS_MODE:-acme}
      - HYSTERIA_CERT_FILE=${HYSTERIA_CERT_FILE:-cert.pem}
      - HYSTERIA_KEY_FILE=${HYSTERIA_KEY_FILE:-key.pem}
      - HYSTERIA_SNI_GUARD=${HYSTERIA_SNI_GUARD:-dns-san}
      - HYSTERIA_ACME_DIR=${HYSTERIA_ACME_DIR:-/acme}
      - HYSTERIA_UDP_IDLE_TIMEOUT=${HYSTERIA_UDP_IDLE_TIMEOUT:-60s}
      - HYSTERIA_BANDWIDTH_UP=${HYSTERIA_BANDWIDTH_UP:-}
      - HYSTERIA_BANDWIDTH_DOWN=${HYSTERIA_BANDWIDTH_DOWN:-}
      - HYSTERIA_MASQUERADE_URL=${HYSTERIA_MASQUERADE_URL:-http://static:80}
    command: ["python3", "/entrypoint.py"]

  traefik:
    image: traefik:latest
    container_name: traefik
    restart: always
    command:
      - --configFile=/etc/traefik/static/traefik.yml
    ports:
      - ${PORT_HTTP:-80}:80
      - ${PORT_HTTPS:-443}:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-config:/etc/traefik/static:ro
      - traefik-dynamic:/etc/traefik/dynamic
      - ./data/acme:/acme
      - ./data/traefik:/data
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:?err}
    depends_on:
      config-gen:
        condition: service_completed_successfully
    networks:
      - cattiva

  xray-reality:
    image: ghcr.io/xtls/xray-core:latest
    container_name: xray-reality
    restart: always
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - xray-reality-config:/etc/xray:ro
    depends_on:
      config-gen:
        condition: service_completed_successfully
    networks:
      - cattiva

  xray-vmess:
    image: ghcr.io/xtls/xray-core:latest
    container_name: xray-vmess
    restart: always
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - xray-vmess-config:/etc/xray:ro
    depends_on:
      config-gen:
        condition: service_completed_successfully
    networks:
      - cattiva

  static:
    image: nginx:alpine
    container_name: cattiva-static
    restart: always
    volumes:
      - ${WWW_DIR:-./www}:/usr/share/nginx/html:ro
    networks:
      - cattiva

  hysteria:
    # Pinned to a specific release: Hysteria 2's config format changes
    # between minor versions (e.g. the namedotcom DNS provider was removed in
    # v2.11.0), so an implicit "latest" can break an existing deployment.
    image: tobyxdd/hysteria:v2.13.0
    container_name: hysteria
    restart: always
    command: ["server", "-c", "/etc/hysteria/server.yaml", "--disable-update-check"]
    ports:
      # Hysteria 2 is QUIC/UDP only. Traefik keeps TCP 443; UDP 443 is a
      # separate protocol space, so both can use port 443.
      - "${HYSTERIA_PORT_HOST:-443}:${HYSTERIA_PORT:-443}/udp"
    volumes:
      - hysteria-config:/etc/hysteria:ro
      - hysteria-acme:/acme
      - ${HYSTERIA_CERT_DIR:-./data/hysteria}:/etc/hysteria-certs:ro
    depends_on:
      config-gen:
        condition: service_completed_successfully
    networks:
      - cattiva

networks:
  cattiva:
    driver: bridge

volumes:
  xray-reality-config:
  xray-vmess-config:
  traefik-dynamic:
  traefik-config:
  hysteria-config:
  hysteria-acme:
