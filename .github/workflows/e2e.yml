name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup test env
        run: |
          REALITY_PRIV=$(docker run --rm --entrypoint /usr/local/bin/xray ghcr.io/xtls/xray-core:latest x25519 | grep Private | awk '{print $NF}')
          REALITY_PUB=$(docker run --rm --entrypoint /usr/local/bin/xray ghcr.io/xtls/xray-core:latest x25519 | grep Public | awk '{print $NF}')

          cat > .env << EOF
          PORT_HTTP=8080
          PORT_HTTPS=8443
          SITE_DOMAIN=test.local
          ACME_EMAIL=ci@test.local
          CF_DNS_API_TOKEN=dummy
          VLESS_UUID=$(docker run --rm --entrypoint /usr/local/bin/xray ghcr.io/xtls/xray-core:latest uuid)
          REALITY_PRIVATE_KEY=$REALITY_PRIV
          REALITY_PUBLIC_KEY=$REALITY_PUB
          REALITY_SHORT_ID=0123456789abcdef
          REALITY_SERVER_NAME=www.apple.com
          VMESS_UUID=$(docker run --rm --entrypoint /usr/local/bin/xray ghcr.io/xtls/xray-core:latest uuid)
          VMESS_WS_PATH=/proxy/ws
          WWW_DIR=./www
          HYSTERIA_PASSWORD=e2e-test-hysteria-password
          EOF

          # The shipped template only supports ACME (DNS-01), which needs a
          # real domain and a real Cloudflare token — neither exists in CI.
          # Seed Hysteria's certificate cache instead: when a valid
          # certificate is already cached for the domain, Hysteria skips
          # issuance and starts normally. The certificate files below mirror
          # the layout and metadata format Hysteria writes after a real
          # issuance, so everything downstream is the production code path.
          CA_DIR=acme-v02.api.letsencrypt.org-directory
          SEED="data/hysteria-seed/certificates/$CA_DIR/test.local"
          mkdir -p "$SEED"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=test.local" \
            -addext "subjectAltName=DNS:test.local" \
            -keyout "$SEED/test.local.key" -out "$SEED/test.local.crt" 2>/dev/null
          chmod 644 "$SEED/test.local.key" "$SEED/test.local.crt"

          cat > "$SEED/test.local.json" << JSON
          {
            "sans": ["test.local"],
            "issuer_data": {
              "url": "https://acme-v02.api.letsencrypt.org/acme/cert/e2e",
              "ca": "https://acme-v02.api.letsencrypt.org/directory",
              "account": "https://acme-v02.api.letsencrypt.org/acme/acct/e2e"
            }
          }
          JSON

      - name: Seed Hysteria certificate cache
        run: |
          # The volume has to exist and be populated before hysteria starts:
          # without a cached certificate the ACME client tries to reach Let's
          # Encrypt and the server exits on failure.
          docker volume create cattiva_hysteria-acme >/dev/null
          docker run --rm \
            -v cattiva_hysteria-acme:/acme \
            -v "$PWD/data/hysteria-seed:/seed:ro" \
            alpine:latest sh -c 'cp -a /seed/. /acme/ && find /acme -type f'

      - name: Start stack
        run: |
          docker compose up -d 2>&1
          sleep 15
          docker compose ps

      - name: Config-gen succeeded
        run: |
          EXIT=$(docker inspect cattiva-config-gen --format '{{.State.ExitCode}}')
          [ "$EXIT" = "0" ] || { docker logs cattiva-config-gen; exit 1; }
          echo "✅ config-gen exit 0"

      - name: xray services are listening
        run: |
          for svc in xray-reality xray-vmess; do
            CID=$(docker ps --filter name=$svc --format '{{.ID}}' | head -1)
            [ -n "$CID" ] || { echo "❌ $svc container not found"; exit 1; }
            # Check process exists (container is running)
            docker inspect $CID --format '{{.State.Status}}' | grep -q running
            echo "✅ $svc running ($CID)"
          done

      - name: nginx serves static site
        run: |
          curl -sk -H 'Host: test.local' \
            https://localhost:8443/ 2>&1 | grep -qi "it works\|html"
          echo "✅ static site"

      - name: Traefik HTTP→HTTPS redirect
        run: |
          code=$(curl -sI -o /dev/null -w '%{http_code}' http://localhost:8080/)
          [ "$code" = "308" ]
          echo "✅ HTTP 308 redirect"

      - name: VLESS+Reality proxy
        run: |
          source .env
          cat > /tmp/client-reality.json << EOF
          {
            "log": {"loglevel": "warning"},
            "inbounds": [{"port": 10808, "protocol": "socks", "settings": {"auth": "noauth"}}],
            "outbounds": [{
              "protocol": "vless",
              "settings": {
                "vnext": [{"address": "traefik", "port": 443, "users": [{"id": "$VLESS_UUID", "flow": "xtls-rprx-vision", "encryption": "none"}]}]
              },
              "streamSettings": {"network": "tcp", "security": "reality", "realitySettings": {"serverName": "www.apple.com", "fingerprint": "chrome", "publicKey": "$REALITY_PUBLIC_KEY", "shortId": "$REALITY_SHORT_ID"}}
            }]
          }
          EOF

          docker run -d --name xray-client \
            -v /tmp/client-reality.json:/etc/xray/config.json:ro \
            -p 10999:10808 \
            --network cattiva_cattiva \
            ghcr.io/xtls/xray-core:latest run -c /etc/xray/config.json
          sleep 3

          docker logs xray-client 2>&1 | grep -q "started" || { docker logs xray-client; exit 1; }
          echo "✅ xray client started"

          echo "=== SOCKS debug ==="
          curl -svx socks5h://localhost:10999 -o /dev/null \
            --connect-timeout 10 http://httpbin.org/get 2>&1 | head -15

      - name: VMess WS endpoint reachable
        run: |
          code=$(curl -sk -o /dev/null -w '%{http_code}' \
            -H 'Host: test.local' \
            https://localhost:8443/proxy/ws)
          echo "HTTP $code"
          # 400 means Traefik routed to xray-vmess (WS upgrade expected)
          [ "$code" = "400" ] || [ "$code" = "200" ] || [ "$code" = "404" ]
          echo "✅ VMess WS routing works"

      - name: CDN alias routes correctly
        run: |
          code=$(curl -sk -o /dev/null -w '%{http_code}' \
            -H 'Host: cdn.test.local' \
            https://localhost:8443/ 2>&1 || echo "CURL_EXIT=$?")
          echo "CDN alias returned: $code"
          # Accept any non-zero response (routed through Traefik)
          [ -n "$code" ] && [ "$code" != "000" ]
          echo "✅ CDN alias routes ($code)"

      - name: Hysteria 2 tunnel works
        run: |
          source .env

          cat > /tmp/client-hysteria.yaml << EOF
          server: hysteria:${PORT_HTTPS}
          auth: "${HYSTERIA_PASSWORD}"
          tls:
            sni: test.local
            insecure: true
          socks5:
            listen: 0.0.0.0:1080
          EOF

          docker inspect hysteria --format '{{.State.Status}}' | grep -q running || {
            echo "❌ hysteria container is not running"
            docker logs hysteria
            exit 1
          }
          echo "✅ hysteria server running"

          docker run -d --name hysteria-client \
            -v /tmp/client-hysteria.yaml:/etc/hysteria/client.yaml:ro \
            --network cattiva_cattiva \
            tobyxdd/hysteria:v2.13.0 client -c /etc/hysteria/client.yaml --disable-update-check
          sleep 4

          docker logs hysteria-client 2>&1 | grep -q "connected to server" \
            || { docker logs hysteria-client; exit 1; }
          echo "✅ hysteria client connected"

          # Keep stderr out of $code: docker prints image-pull progress there,
          # which would otherwise be captured together with the HTTP status.
          code=$(docker run --rm --network cattiva_cattiva alpine:latest sh -c \
            "apk add -q curl >/dev/null 2>&1 && curl -sS --max-time 30 \
             -x socks5h://hysteria-client:1080 -o /dev/null -w '%{http_code}' \
             https://api.ipify.org" 2>/tmp/hysteria-curl.err) || true
          echo "Hysteria tunnel returned: $code"
          [ "$code" = "200" ] || {
            echo "--- curl stderr ---"
            cat /tmp/hysteria-curl.err
            docker logs hysteria-client
            exit 1
          }
          echo "✅ Hysteria 2 tunnel works"

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v 2>/dev/null
          docker rm -f xray-client 2>/dev/null || true
          docker rm -f hysteria-client 2>/dev/null || true
